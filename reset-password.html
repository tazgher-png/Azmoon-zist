<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تغییر رمز عبور</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: sans-serif;
            background: #f1f8f4;
            padding: 30px;
            text-align: center;
        }

        .box {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #ccc;
        }

        input {
            width: 90%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 95%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #187a42;
            color: white;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>🔐 تغییر رمز عبور</h2>

    <input
        type="password"
        id="new-password"
        placeholder="رمز عبور جدید"
    >

    <input
        type="password"
        id="confirm-password"
        placeholder="تکرار رمز عبور جدید"
    >

    <button onclick="changePassword()">
        تغییر رمز عبور
    </button>

</div>

<script>

const SUPABASE_URL =
    "https://taeqejwbmzdlskhjdlzh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Th5iRUk-4PdiFcF5zlj05A_3h-eWmcm";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function changePassword() {

    const password =
        document.getElementById("new-password").value;

    const confirmPassword =
        document.getElementById("confirm-password").value;


    if (password === "" || confirmPassword === "") {

        alert("⚠️ لطفاً هر دو کادر را پر کنید.");

        return;
    }


    if (password !== confirmPassword) {

        alert("❌ دو رمز عبور یکسان نیستند.");

        return;
    }


    if (password.length < 6) {

        alert("⚠️ رمز عبور باید حداقل ۶ کاراکتر باشد.");

        return;
    }


    const { error } =
        await supabaseClient.auth.updateUser({
            password: password
        });


    if (error) {

        console.error(error);

        alert(
            "❌ خطا در تغییر رمز:\n" +
            error.message
        );

        return;
    }


    alert("✅ رمز عبور با موفقیت تغییر کرد.");

    window.location.href = "teacher.html";
}

</script>

</body>
</html>
